<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Оплата</title>
  <style>
    body { font-family: -apple-system; background: #0a0a0a; color: #fff; padding: 20px; }
    input, button { width: 100%; padding: 14px; margin-top: 10px; border-radius: 12px; border: none; font-size: 16px; }
    input { background: #1a1a1a; color: #fff; }
    button { background: #00ff88; font-weight: bold; }
    .card { background: #1a1a1a; padding: 15px; border-radius: 12px; margin-top: 15px; }
  </style>
</head>
<body>
  <h2>💳 Пополнение</h2>
  <input type="text" id="apiKey" placeholder="Введите API Key">
  <input type="number" id="amount" placeholder="Сумма в RUB" value="1000">
  <button id="payBtn">Оплатить</button>
  <div id="result" class="card"></div>

  <script>
    const API_URL = 'https://ЗАМЕНИТЕ_НА_ВАШ_API_URL'; // ЗАМЕНИ ПОТОМ

    document.getElementById('payBtn').onclick = async () => {
      const apiKey = document.getElementById('apiKey').value;
      const amount = document.getElementById('amount').value;

      if (!apiKey) {
        document.getElementById('result').innerHTML = '❌ Введите API Key';
        return;
      }

      const res = await fetch(API_URL + '/api/order', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey
        },
        body: JSON.stringify({
          amount_rub: amount,
          player_id: 'user_' + Date.now()
        })
      });
      const data = await res.json();

      if (data.card) {
        document.getElementById('result').innerHTML = `
          ✅ Переведи ${data.amount} RUB на карту:<br>
          <b>${data.card}</b><br>
          Банк: ${data.bank}<br>
          После оплаты трейдер подтвердит.
        `;
      } else {
        document.getElementById('result').innerHTML = '❌ ' + (data.error || 'Ошибка');
      }
    };
  </script>
</body>
</html>
